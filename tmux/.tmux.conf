# --- General Settings ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g status-position top
set -g base-index 1          # Start windows at 1, not 0
setw -g pane-base-index 1    # Start panes at 1, not 0
set -g renumber-windows on   # Clean up window numbers on close
# Open new windows in the current path
bind c new-window -c "#{pane_current_path}"
# Open new panes in the current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# --- Keybindings ---
unbind r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

set -g prefix C-s             # Your preferred prefix
unbind C-b
bind C-s send-prefix

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# --- Cursor Theme (Matches your Kitty/Nvim) ---
# Colors
# Background: #191c22 | Cyan: #88c0d0 | Inactive: #4c566a | Selection: #434c5e

set -g status-style "bg=default,fg=#d8dee9" # Transparent bg
set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#88c0d0" # Cursor cyan
set -g pane-border-line simple

# Status Left: Session Name
set -g status-left "#[fg=#191c22,bg=#88c0d0,bold]  #S #[fg=#88c0d0,bg=default] "
set -g status-left-length 20

# Window Tabs
set -g window-status-format "#[fg=#4c566a] #I:#W "
set -g window-status-current-format "#[fg=#88c0d0,bg=#272c36,bold]#[fg=#191c22,bg=#88c0d0] #I:#W #[fg=#88c0d0,bg=#272c36]"

# Status Right: Path & Time
set -g status-right "#[fg=#4c566a]#[fg=#d8dee9,bg=#4c566a]  #{b:pane_current_path} #[fg=#88c0d0,bg=#4c566a]#[fg=#191c22,bg=#88c0d0] %H:%M "

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator' # Seamless nav between tmux & nvim

# --- Make C-h/j/k/l work in Vim & Tmux ---
set -g @vim-tmux-navigator 'C-h'
set -g @vim-tmux-navigator 'C-j'
set -g @vim-tmux-navigator 'C-k'
set -g @vim-tmux-navigator 'C-l'
# Initialize TPM (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
