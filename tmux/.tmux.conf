# --- General Settings ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g status-position top
set -g base-index 1          # Start windows at 1, not 0
setw -g pane-base-index 1    # Start panes at 1, not 0
set -g renumber-windows on   # Clean up window numbers on close
# Open new windows in the current path
bind c new-window -c "#{pane_current_path}"
# Open new panes in the current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# --- Keybindings ---
unbind r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

set -g prefix C-s             # Your preferred prefix
unbind C-b
bind C-s send-prefix

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# --- Catppuccin Mocha (Matches Kitty/Nvim) ---
# Crust: #11111b | Mauve: #cba6f7 | Lavender: #b4befe | Overlay0: #6c7086 | Mantle: #181825

set -g status-style "bg=default,fg=#cdd6f4" # Transparent bg
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#b4befe"
set -g pane-border-line simple

# Status Left: Session Name
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=default] "
set -g status-left-length 20

# Window Tabs
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[fg=#cba6f7,bg=#181825,bold]#[fg=#11111b,bg=#cba6f7] #I:#W #[fg=#cba6f7,bg=#181825]"

# Status Right: Path & Time
set -g status-right "#[fg=#6c7086]#[fg=#cdd6f4,bg=#6c7086]  #{b:pane_current_path} #[fg=#cba6f7,bg=#6c7086]#[fg=#11111b,bg=#cba6f7] %H:%M "

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator' # Seamless nav between tmux & nvim

# --- Make C-h/j/k/l work in Vim & Tmux ---
set -g @vim-tmux-navigator 'C-h'
set -g @vim-tmux-navigator 'C-j'
set -g @vim-tmux-navigator 'C-k'
set -g @vim-tmux-navigator 'C-l'
# Initialize TPM (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
