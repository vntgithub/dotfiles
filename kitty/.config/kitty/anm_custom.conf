# Custom overrides (empty - Cursor theme handles all colors)
# ==============================================================================
# Cursor / Neovim Unified Theme
# ==============================================================================

# Core Colors (Synced with Neovim & Cursor JSON)
foreground            #7b88a1
background            #1e2127
selection_foreground  #d8dee9
selection_background  #434c5e
url_color             #8fbcbb

# Cursor Colors
cursor                #d8dee9
cursor_text_color     #1e2127
cursor_shape          block
shell_integration     no-cursor

# Terminal 16 Colors (ANSI Sync)
color0  #272c36
color8  #4c566a
color1  #bf616a
color9  #bf616a
color2  #a3be8c
color10 #a3be8c
color3  #ebcb8b
color11 #ebcb8b
color4  #81a1c1
color12 #81a1c1
color5  #7d7c9b
color13 #b48ead
color6  #88c0d0
color14 #8fbcbb
color7  #e5e9f0
color15 #eceff4

# ==============================================================================
# Window UI & Layout (The "Seamless" Part)
# ==============================================================================

# Window Padding: Adds "breathing room" like a modern IDE
window_padding_width 10

# Borders: Matches Neovim 'rounded' border and WinSeparator
active_border_color   #88c0d0
inactive_border_color #26292f
window_border_width   1pt
draw_minimal_borders  yes

# Tab Bar: Matches Bufferline/Cursor Tab settings
tab_bar_style         separator
tab_separator         ""
tab_title_template    " {index}: {title} "

active_tab_foreground   #d8dee9
active_tab_background   #1e2127
active_tab_font_style   bold
inactive_tab_foreground #4b5163
inactive_tab_background #191c22
tab_bar_background      #191c22

# ==============================================================================
# Performance & High-DPI (Optimized for 4K)
# ==============================================================================
# Adjust line height for better readability (matches 'editor.lineHeight' feel)
modify_font line_height 115%

# Use the GPU efficiently on Arch
repaint_delay    8
input_delay      2
sync_to_monitor  yes

