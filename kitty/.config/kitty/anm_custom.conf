# Custom overrides (layout, cursor, performance — colors come from mocha.conf)
# ==============================================================================
# Window UI & Layout
# ==============================================================================

cursor_shape          block
shell_integration     no-cursor

# Window Padding: Adds "breathing room" like a modern IDE
window_padding_width 10

# Borders
window_border_width   1pt
draw_minimal_borders  yes

# Tab Bar
tab_bar_style         separator
tab_separator         ""
tab_title_template    " {index}: {title} "
active_tab_font_style   bold

# ==============================================================================
# Performance & High-DPI (Optimized for 4K)
# ==============================================================================
# Adjust line height for better readability (matches 'editor.lineHeight' feel)
modify_font line_height 115%

# Use the GPU efficiently on Arch
repaint_delay    8
input_delay      2
sync_to_monitor  yes
