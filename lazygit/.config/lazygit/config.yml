gui:
  # Enable Nerd Fonts (since you use them in Neovim)
  nerdFontsVersion: "3"
  theme:
    # Border color of focused panels (Cursor Cyan)
    activeBorderColor:
      - "#88c0d0"
      - bold
    # Border color of unfocused panels (Nord Grey)
    inactiveBorderColor:
      - "#4c566a"
    # Search matches (Cursor Magenta)
    searchingActiveBorderColor:
      - "#b48ead"
      - bold
    # Background color for selected items (Matches Neovim Visual)
    selectedLineBgColor:
      - "#343b49"
    # Foreground color for selected range (Matches Neovim Selection)
    selectedRangeBgColor:
      - "#434c5e"
    # Cherry-picked commits (Cyan contrast)
    cherryPickedCommitBgColor:
      - "#434c5e"
    cherryPickedCommitFgColor:
      - "#88c0d0"
    # Rebase markers (Yellow)
    markedBaseCommitBgColor:
      - "#ebcb8b"
    markedBaseCommitFgColor:
      - "#191c22"
    # Git Status Colors
    unstagedChangesColor:
      - "#bf616a" # Red
    stagedChangesColor:
      - "#a3be8c" # Green
    # Default text color (Matches your Cursor foreground)
    defaultFgColor:
      - "#7b88a1"
    # Options/Keybind text (Blue)
    optionsTextColor:
      - "#81a1c1"
  # Author colors (using your Cyan accent)
  authorColors:
    "*": "#88c0d0"
# Optional: Add these to make the UI feel even more like Cursor/Neovim
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
