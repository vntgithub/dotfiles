gui:
  # Matching your nerdFontsVersion: ""
  showIcons: false

  theme:
    # Border color of focused panels (#88c0d0)
    activeBorderColor:
      - "#88c0d0"
      - bold

    # Border color of unfocused panels (#4c566a)
    inactiveBorderColor:
      - "#4c566a"

    # Background color for selected lines (#21242b)
    selectedLineBgColor:
      - "#21242b"

    # Foreground color for selected range/options (#81a1c1)
    optionsTextColor:
      - "#81a1c1"

    # Default text color (#d8dee9)
    defaultFgColor:
      - "#d8dee9"

    # Mapping your 'unstaged' red to entity states (stopped containers/errors)
    entityStatColor:
      - "#bf616a"
